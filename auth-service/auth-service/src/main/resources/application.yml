spring:
  application:
    name: 'auth-service'
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      show_sql: true

server:
  port: ${SERVER_PORT}
jwt:
  access-token:
    expiration: 900000
  refresh-token:
    expiration: 86400000
user-service:
  url: ${USER_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1
  otlp:
    tracing:
      endpoint: http://alloy:4318/v1/traces
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
