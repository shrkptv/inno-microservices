name: CI Pipeline Payment Service

on:
  push:
    branches:
      - '*'
  pull_request:

defaults:
  run:
    working-directory: payment-service

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-build-artifacts
          path: |
            payment-service/target/classes/
            payment-service/target/test-classes/
            payment-service/target/*.jar

  test:
    name: Test (Unit + Integration)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Enable Docker (Required for Testcontainers)
        run: |
          sudo systemctl start docker
          docker --version

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: payment-service-build-artifacts
          path: payment-service/target
          merge-multiple: true

      - name: Run tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
          TESTCONTAINERS_CHECKS_DISABLE: "true"
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-test-artifacts
          path: |
            payment-service/target/surefire-reports/
            payment-service/target/failsafe-reports/

  sonar:
    name: Code Analysis (SonarQube)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: payment-service-build-artifacts
          path: payment-service/target
          merge-multiple: true

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: payment-service-test-artifacts
          path: payment-service/target
          merge-multiple: true

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw sonar:sonar
