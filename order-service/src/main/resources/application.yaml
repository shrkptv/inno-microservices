spring:
  application:
    name: 'order-service'
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}

    topics:
      payments:
        name: payment-events
        replicas: 1
        partitions: 3
      orders:
        name: order-events
        replicas: 1
        partitions: 3
server:
  port: ${SERVER_PORT}

user-service:
    url: ${USER_SERVICE_URL}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1
  otlp:
    tracing:
      endpoint: http://alloy:4318/v1/traces