services:
  auth-db:
    image: postgres:latest
    container_name: auth-service-database
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${AUTH_DB_PORT}:5432
    volumes:
      - auth-service-database-data:/var/lib/postgresql/data

  user-db:
    image: postgres:15
    container_name: user-service-database
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${USER_DB_PORT}:5432
    volumes:
      - user-service-database-data:/var/lib/postgresql/data

  order-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${ORDER_DB_PORT}:5432
    volumes:
      - order-service-database-data:/var/lib/postgresql/data

  payment-db:
      image: mongo:latest
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      volumes:
        - mongo:/data/db
      ports:
        - ${MONGODB_PORT}:27017

  kafka:
    image: apache/kafka-native:latest
    environment:
      - CLUSTER_ID='LOCAL'
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    ports:
      - ${KAFKA_PORT}:9092

  redis:
    image: redis:7
    container_name: redis
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  auth-service:
    build:
      context: ./auth-service/auth-service
    container_name: authentication-service
    ports:
      - ${AUTH_SERVICE_PORT}:8000
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-db

  user-service:
    build:
      context: ./user-service
    container_name: user-service-rest
    ports:
      - ${USER_SERVICE_PORT}:8081
    environment:
      SPRING_DATASOURCE_URL: ${USER_DB_URL}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: ${USER_SERVICE_PORT}
    depends_on:
      - user-db
      - auth-service
      - redis

  order-service:
    build:
      context: ./order-service
    container_name: order-service-1
    ports:
      - ${ORDER_SERVICE_PORT}:8082
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${ORDER_DB_URL}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT}
      USER_SERVICE_URL: http://user-service:${USER_SERVICE_PORT}
      CONSUMER_GROUP_ID: ${ORDER_CONSUMER_GROUP_ID}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      SERVER_PORT: ${ORDER_SERVICE_PORT}
    depends_on:
      - order-db
      - kafka
      - auth-service
      - user-service

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - ${PAYMENT_SERVICE_PORT}:8084
    environment:
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      SERVER_PORT: ${PAYMENT_SERVICE_PORT}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID}
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_PORT: ${KAFKA_PORT}
    depends_on:
      - payment-db
      - kafka
      - auth-service
      - user-service
      - order-service


  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - ${API_GATEWAY_PORT}:8080
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      AUTH_CLIENT_URL: ${AUTH_CLIENT_URL}
      SERVER_PORT: ${API_GATEWAY_PORT}
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service

volumes:
  auth-service-database-data:
  user-service-database-data:
  order-service-database-data:
  redis-data:
  mongo:
