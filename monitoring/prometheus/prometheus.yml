global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'inno-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'auth-service:8000'
        - 'user-service:8081'
        - 'order-service:8082'
        - 'payment-service:8084'
        - 'api-gateway:8080'