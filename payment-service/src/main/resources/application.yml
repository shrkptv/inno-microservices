spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
    topics:
      payments:
        name: payment-events
        replicas: 1
        partitions: 3
      orders:
        name: order-events
        replicas: 1
        partitions: 3


server:
  port: ${SERVER_PORT}

external-api:
  url: ${EXTERNAL_API_URL}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1
  otlp:
    tracing:
      endpoint: http://alloy:4318/v1/traces
