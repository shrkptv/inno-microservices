server:
  port: ${SERVER_PORT}

spring:
  application:
    name: 'api-gateway'
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - AuthenticationFilter

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - AuthenticationFilter

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - AuthenticationFilter
            - id: auth-service-swagger
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth, /v3/api-docs
              metadata:
                springdoc:
                  display-name: "Auth Service API"

            - id: user-service-swagger
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/users
              filters:
                - RewritePath=/v3/api-docs/users, /v3/api-docs
              metadata:
                springdoc:
                  group: "User Service API"

            - id: order-service-swagger
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/orders
              filters:
                - RewritePath=/v3/api-docs/orders, /v3/api-docs
              metadata:
                springdoc:
                  group: "Order Service API"

            - id: payment-service-swagger
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/payments
              filters:
                - RewritePath=/v3/api-docs/payments, /v3/api-docs
              metadata:
                springdoc:
                  group: "Payment Service API"
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_URL}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true

auth-client:
  url: ${AUTH_CLIENT_URL}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1
  otlp:
    tracing:
      endpoint: http://alloy:4318/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  packagesToScan: none
  swagger-ui:
    path: /swagger-ui.html
    server-url: /
    urls-primary-name: "Auth Service API"
    urls:
      - name: Auth Service API
        url: /v3/api-docs/auth
      - name: User Service API
        url: /v3/api-docs/users
      - name: Order Service API
        url: /v3/api-docs/orders
      - name: Payment Service API
        url: /v3/api-docs/payments