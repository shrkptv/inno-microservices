apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: inno-microservices
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-auth-db
          image: busybox
          command:
            - sh
            - -c
            - >
              until nc -z auth-db 5432; do echo "waiting for auth-db"; sleep 2; done
      containers:
        - name: auth-service
          imagePullPolicy: IfNotPresent
          image: inno-microservices-auth-service:latest
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-environment
                  key: AUTH_DB_URL
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-environment
                  key: JWT_SECRET