apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inno-microservices
resources:
  - ../../base
patches:
  - path: patches/api-gateway-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
  - path: patches/auth-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service
  - path: patches/order-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: order-service
  - path: patches/payment-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service
  - path: patches/user-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: user-service